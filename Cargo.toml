[workspace]
members = [
    "crates/winycast-app",
    "crates/winycast-ui",
    "crates/winycast-core",
    "crates/winycast-platform-windows",
    "crates/winycast-storage",
    "crates/winycast-providers",
]
default-members = ["crates/winycast-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "=1.0.104"
async-channel = "=2.5.0"
futures-lite = "=2.6.1"
gpui = { version = "=0.2.2", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["bmp", "png"] }
pinyin = "=0.10.0"
pulldown-cmark = { version = "=0.13.0", default-features = false }
raw-window-handle = "=0.6.2"
rusqlite = { version = "=0.32.1", features = ["bundled", "functions"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
unicode-segmentation = "=1.13.3"
url = "=2.5.8"
windows = "=0.61.1"
winycast-core = { path = "crates/winycast-core" }
winycast-platform-windows = { path = "crates/winycast-platform-windows" }
winycast-providers = { path = "crates/winycast-providers" }
winycast-storage = { path = "crates/winycast-storage" }
winycast-ui = { path = "crates/winycast-ui" }
