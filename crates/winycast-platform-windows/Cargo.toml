[package]
name = "winycast-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
image.workspace = true
raw-window-handle.workspace = true
windows-registry = "=0.4.0"
winycast-core.workspace = true
windows = { workspace = true, features = [
    "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power", "Win32_System_Search", "Win32_System_Shutdown", "Win32_System_Variant", "Win32_System_WinRT",
    "Win32_Security", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
